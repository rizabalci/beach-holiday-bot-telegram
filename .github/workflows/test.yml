name: Tests

on:
  pull_request:
  push:
    paths:
      - "check_beach.py"
      - "test_check_beach.py"
      - ".github/workflows/test.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest test_check_beach.py
