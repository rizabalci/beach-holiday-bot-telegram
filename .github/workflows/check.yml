name: Beach holiday scan

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily
  workflow_dispatch:

# A slow API run must never overlap with the next scheduled one.
concurrency:
  group: beach-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # Hard ceiling. A full tiered scan runs about 50 minutes, so this leaves
    # headroom for a slow API day without letting a stuck run burn hours.
    timeout-minutes: 70

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run scan
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HOTEL_SPLIT: "1"
          # Optional repository variables. Leave unset to keep the script defaults:
          # MIN_COVERAGE=0.10, PARTIAL_COVERAGE=0.50, MAX_TRANSPORT_ERROR_RATE=0.25,
          # MAX_WORKERS=6, PACE_SECONDS=0.
          # A thin fare cache publishes a partial board. The job fails only when
          # coverage is under MIN_COVERAGE or too many calls error.
          MIN_COVERAGE: ${{ vars.MIN_COVERAGE }}
          PARTIAL_COVERAGE: ${{ vars.PARTIAL_COVERAGE }}
          MAX_TRANSPORT_ERROR_RATE: ${{ vars.MAX_TRANSPORT_ERROR_RATE }}
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
          PACE_SECONDS: ${{ vars.PACE_SECONDS }}
        run: python check_beach.py

      - name: Commit updated data
        run: |
          git config user.name  "beach-bot"
          git config user.email "beach-bot@users.noreply.github.com"
          git add -A deals.json price_history.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Scan $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Retry once: a manual push from the laptop can land mid-run.
            git push || (git pull --rebase --autostash && git push)
          fi
